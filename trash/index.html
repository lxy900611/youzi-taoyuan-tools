<style>
/* trash.html 專屬 */
.rangeRow{display:flex;gap:6px;margin-top:8px;align-items:center}
.rangeRow button{flex:none;background:#0d6d60;color:#cfe6e0;border:1px solid #17897a;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.rangeRow button.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.trashCard{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid #e4e9e6;border-radius:10px;margin-bottom:6px}
.trashCard.best{border-color:var(--amber);background:#fff9f5}
.trashCard .ticon{flex:none;width:34px;height:34px;border-radius:9px;background:#eef6f4;display:flex;align-items:center;justify-content:center;font-size:17px}
.trashCard .tnm{font-size:14.5px;font-weight:700}
.trashCard .tnm small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:4px}
.trashCard .td{font-size:12px;color:var(--muted);margin-top:1px}
.trashCard .ttime{font-size:13px;color:var(--teal);font-weight:700;margin-top:3px}
.bestbadge{display:inline-block;background:var(--amber);color:#fff;border-radius:4px;font-size:10.5px;padding:1px 5px;margin-right:5px;font-weight:700;vertical-align:middle}
.copyBtn{display:block;width:100%;background:#eef6f4;color:var(--teal2);border:1px solid #c9e2dc;border-radius:10px;padding:9px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>
<div id="shell">
<header>
  <div class="brandRow">
    <div class="badge"><img src="/assets/logo.png" alt="柚子林顯祐"></div>
    <div>
      <h1>大桃園垃圾車地圖</h1>
      <div class="sub">桃園市全13區｜柚子幫你找學區宅</div>
    </div>
    <nav class="navlinks">
      <a href="/">🎓 學區地圖</a>
      <a href="/nearby/">🛒 周邊機能</a>
      <a href="/trash/" class="on">🚛 垃圾車</a>
    </nav>
  </div>

  <div class="stepRow">
    <select id="selCounty"><option value="桃園市">① 桃園市</option></select>
    <select id="selDistrict">
      <option value="">② 選地區</option>
      <option value="桃園區">桃園區</option>
      <option value="中壢區">中壢區</option>
      <option value="平鎮區">平鎮區</option>
      <option value="八德區">八德區</option>
      <option value="楊梅區">楊梅區</option>
      <option value="蘆竹區">蘆竹區</option>
      <option value="大溪區">大溪區</option>
      <option value="大園區">大園區</option>
      <option value="龜山區">龜山區</option>
      <option value="龍潭區">龍潭區</option>
      <option value="新屋區">新屋區</option>
      <option value="觀音區">觀音區</option>
      <option value="復興區">復興區</option>
    </select>
  </div>
  <div class="addrRow">
    <input id="addrInput" type="text" placeholder="③ 選好地區後，輸入路名門牌" enterkeyhint="search" disabled autocomplete="off">
    <button id="searchBtn">查詢</button>
    <button id="gpsBtn" title="用目前位置查詢">📍定位</button>
  </div>
  <div class="hintline">查好地址後，看附近垃圾車／資收車幾點來。</div>

  <div class="toolRow">
    <div class="seg">
      <button id="segTrash" class="on">🚛 垃圾車</button>
      <button id="segRecycle">♻️ 資收車</button>
    </div>
  </div>
  <div class="rangeRow" id="rangeRow"></div>
</header>

<div id="map"></div>
</div>

<div id="resultPanel">
  <div class="handle" id="panelHandle"><i></i><span class="peek">▲ 上滑看清單</span></div>
  <button class="closeBtn" onclick="closePanel()">✕</button>
  <div id="panelBody"></div>
</div>
<div id="msgBox"></div>

<footer id="creditBar">
  <b>中壢房產顧問柚子</b>
  <a href="tel:0968877611">📞 0968-877-611</a>

</footer>

<script src="/geocode.js"></script>
<script src="/trash.js"></script>
</body>
</html>
